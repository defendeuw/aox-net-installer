<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AoX Net Installer</title>
  <link rel="icon" href="AoXBlue.png" type="image/png">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      background: linear-gradient(135deg, #1e1b4b 0%, #312e81 50%, #1e293b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      color: #fff;
    }

    .container {
      width: 90%;
      max-width: 700px;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 20px;
      padding: 40px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo-img {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px;
      background-image: url('AoXBlue.png');
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
    }

    .logo h1 {
      font-size: 32px;
      font-weight: 700;
      background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }

    .logo p {
      color: #94a3b8;
      font-size: 14px;
    }

    .status-container {
      margin: 30px 0;
    }

    .status-message {
      text-align: center;
      font-size: 16px;
      color: #e2e8f0;
      margin-bottom: 20px;
      min-height: 24px;
    }

    .ai-message {
      text-align: center;
      font-size: 13px;
      color: #a78bfa;
      margin-bottom: 15px;
      min-height: 20px;
      font-style: italic;
      background: rgba(139, 92, 246, 0.1);
      padding: 8px 15px;
      border-radius: 8px;
      border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .progress-info {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 10px;
    }

    .progress-bar-container {
      height: 22px;
      background: rgba(51, 65, 85, 0.5);
      border-radius: 11px;
      overflow: hidden;
      margin-bottom: 20px;
      border: 1px solid rgba(139, 92, 246, 0.2);
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #8b5cf6 0%, #3b82f6 100%);
      transition: width 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      font-size: 12px;
      font-weight: 600;
    }

    .steps {
      display: flex;
      justify-content: space-around;
      margin: 30px 0 40px 0;
    }

    .step {
      display: flex;
      flex-direction: column;
      align-items: center;
      opacity: 0.3;
      transition: opacity 0.3s;
    }

    .step.active {
      opacity: 1;
    }

    .step-icon {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 3px solid #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      font-size: 20px;
      transition: all 0.3s;
    }

    .step.active .step-icon {
      border-color: #8b5cf6;
      background: rgba(139, 92, 246, 0.2);
      animation: pulse 2s infinite;
    }

    .step.complete .step-icon {
      border-color: #10b981;
      background: rgba(16, 185, 129, 0.2);
    }

    .step-label {
      font-size: 12px;
      color: #94a3b8;
      text-align: center;
      margin-top: 5px;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .button-group {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 25px;
      flex-wrap: wrap;
    }

    .btn {
      padding: 14px 32px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 140px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #8b5cf6 0%, #3b82f6 100%);
      color: white;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(139, 92, 246, 0.4);
    }

    .btn-secondary {
      background: rgba(51, 65, 85, 0.8);
      color: #e2e8f0;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .btn-secondary:hover {
      background: rgba(51, 65, 85, 1);
      border-color: rgba(139, 92, 246, 0.5);
    }

    .hidden {
      display: none !important;
    }

    .error-container {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
      text-align: center;
    }

    .error-title {
      color: #fca5a5;
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .error-message {
      color: #fecaca;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .install-path {
      text-align: center;
      font-size: 13px;
      color: #64748b;
      margin-top: 15px;
      padding: 10px;
      background: rgba(51, 65, 85, 0.3);
      border-radius: 8px;
    }

    .progress-section {
      margin: 20px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <div class="logo-img"></div>
      <h1>⚔️ AoX Net Installer</h1>
      <p>Armies of Exigo Matchmaking Client</p>
    </div>

    <div class="status-container">
      <div id="statusMessage" class="status-message">Initializing...</div>
      <div id="aiMessage" class="ai-message">� AI system ready</div>

      <div id="progressSection" class="progress-section hidden">
        <div class="progress-info">
          <span id="progressText">0%</span>
          <span id="sizeText">0 MB / 0 MB</span>
        </div>
        <div class="progress-bar-container">
          <div id="progressBar" class="progress-bar" style="width: 0%">
            <span id="progressPercent"></span>
          </div>
        </div>
      </div>

      <div class="steps">
        <div id="stepChecking" class="step active">
          <div class="step-icon">🔍</div>
          <div class="step-label">Checking</div>
        </div>
        <div id="stepDownloading" class="step">
          <div class="step-icon">⬇️</div>
          <div class="step-label">Downloading</div>
        </div>
        <div id="stepInstalling" class="step">
          <div class="step-icon">⚙️</div>
          <div class="step-label">Installing</div>
        </div>
        <div id="stepComplete" class="step">
          <div class="step-icon">✓</div>
          <div class="step-label">Complete</div>
        </div>
      </div>

      <div id="updateSection" class="error-container hidden" style="background: rgba(59, 130, 246, 0.1); border-color: rgba(59, 130, 246, 0.3);">
        <div class="error-title" style="color: #60a5fa;">Update Available!</div>
        <div id="updateMessage" class="error-message" style="color: #93c5fd;">A new version is available</div>
        <div class="button-group">
          <button class="btn btn-primary" onclick="confirmUpdate()">Update Now</button>
          <button class="btn btn-secondary" onclick="skipUpdate()">Launch Current Version</button>
        </div>
      </div>

      <div id="errorSection" class="error-container hidden">
        <div class="error-title">⚠️ Installation Failed</div>
        <div id="errorMessage" class="error-message">An error occurred</div>
        <div class="button-group">
          <button class="btn btn-primary" onclick="retryDownload()">🔄 Retry</button>
          <button class="btn btn-secondary" onclick="showLogs()">� Show Logs</button>
        </div>
      </div>

      <div class="install-path" id="installPath">Preparing...</div>
    </div>
  </div>

  <script>
    let currentStatus = 'checking';
    let currentDownloadPath = '';
    let currentInstallPath = 'C:\\\\AoX\\\\AoXClient';

    function setStep(step) {
      const steps = ['stepChecking', 'stepDownloading', 'stepInstalling', 'stepComplete'];
      steps.forEach(s => {
        const element = document.getElementById(s);
        element.classList.remove('active', 'complete');

        if (s === step) {
          element.classList.add('active');
        } else if (steps.indexOf(s) < steps.indexOf(step)) {
          element.classList.add('complete');
        }
      });
    }

    function updateAIMessage(message) {
      document.getElementById('aiMessage').textContent = message;
    }

    function updateStatus(message, status, downloadPath, installPath) {
      document.getElementById('statusMessage').textContent = message;
      currentStatus = status || currentStatus;

      // Update paths if provided
      if (downloadPath) currentDownloadPath = downloadPath;
      if (installPath) currentInstallPath = installPath;

      // Update path text based on status
      const pathElement = document.getElementById('installPath');
      if (status === 'checking') {
        pathElement.textContent = 'Checking installation...';
        setStep('stepChecking');
      } else if (status === 'downloading') {
        pathElement.textContent = currentDownloadPath || 'Downloading from server...';
        setStep('stepDownloading');
        document.getElementById('progressSection').classList.remove('hidden');
      } else if (status === 'verifying') {
        if (document.getElementById('progressBar').style.width === '100%') {
          pathElement.textContent = 'Verifying installation...';
        } else {
          pathElement.textContent = 'Verifying download...';
        }
      } else if (status === 'installing') {
        pathElement.textContent = currentInstallPath ? `Installing to: ${currentInstallPath}` : 'Extracting files...';
        setStep('stepInstalling');
        // Keep progress visible during extraction
      } else if (status === 'complete') {
        pathElement.textContent = `Installed to: ${currentInstallPath}`;
        setStep('stepComplete');
        document.getElementById('progressSection').classList.add('hidden');
      } else if (status === 'error') {
        pathElement.textContent = 'Installation failed - check logs for details';
        document.getElementById('errorSection').classList.remove('hidden');
        document.getElementById('progressSection').classList.add('hidden');
      }
    }

    function updateProgress(data) {
      const progress = data.percent || 0;
      const receivedMB = (data.received / 1024 / 1024).toFixed(1);
      const totalMB = (data.total / 1024 / 1024).toFixed(1);

      document.getElementById('progressBar').style.width = progress + '%';
      document.getElementById('progressText').textContent = progress + '%';
      document.getElementById('progressPercent').textContent = progress > 10 ? progress + '%' : '';

      if (data.total > 0) {
        document.getElementById('sizeText').textContent = receivedMB + ' MB / ' + totalMB + ' MB';
      }
    }

    function showError(message) {
      document.getElementById('errorMessage').textContent = message;
      document.getElementById('errorSection').classList.remove('hidden');
      document.getElementById('progressSection').classList.add('hidden');
      updateStatus('Installation Failed', 'error');
      updateAIMessage('❌ Installation failed - logs available');
    }

    function showLogs() {
      window.electron.showLogs();
    }

    function retryDownload() {
      document.getElementById('errorSection').classList.add('hidden');
      updateStatus('Retrying...', 'checking');
      updateAIMessage('� AI restarting installation...');
      checkAndDownload();
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function checkAndDownload() {
      try {
        updateStatus('Checking installation...', 'checking');
        updateAIMessage('� Scanning system...');
        await sleep(500);

        const isInstalled = await window.electron.checkInstalled();

        if (isInstalled) {
          updateStatus('Checking for updates...', 'checking');
          updateAIMessage('� Comparing versions...');
          await sleep(1000);

          const serverVersion = await window.electron.fetchServerVersion();
          const localVersion = await window.electron.getLocalVersion();

          if (serverVersion === localVersion) {
            updateStatus('Already up to date! Launching...', 'complete');
            updateAIMessage('✅ Latest version detected');
            await sleep(1000);
            launchClient();
            return;
          } else {
            // Show update available UI - wait for user to click button
            updateStatus('Update available!', 'checking');
            updateAIMessage('New version: v' + serverVersion);
            document.getElementById('updateMessage').textContent =
              'Installed: v' + localVersion + ' → Available: v' + serverVersion;
            document.getElementById('updateSection').classList.remove('hidden');
            document.getElementById('installPath').textContent = 'Update ready to download';
            // Wait for user to click "Update Now" or "Launch Current Version"
            return;
          }
        }

        // First time install - start download automatically
        await downloadClient();
      } catch (error) {
        console.error('Bootstrap error:', error);
        showError(error.message || 'Failed to download AoX Client');
      }
    }

    function confirmUpdate() {
      document.getElementById('updateSection').classList.add('hidden');
      downloadClient();
    }

    function skipUpdate() {
      document.getElementById('updateSection').classList.add('hidden');
      updateStatus('Launching current version...', 'complete');
      updateAIMessage('Skipping update');
      launchClient();
    }

    async function downloadClient() {
      updateStatus('Starting download...', 'downloading');
      updateAIMessage('AI preparing download strategies...');

      try {
        await window.electron.downloadClient();
        updateStatus('Installation complete!', 'complete');
        updateAIMessage('✅ Installation successful!');
        updateProgress({ percent: 100, received: 0, total: 0 });
        await sleep(1500);
        launchClient();
      } catch (error) {
        showError(error.message || 'Download failed');
      }
    }

    async function launchClient() {
      updateStatus('Launching AoX Client...', 'complete');
      updateAIMessage('� Starting game client...');
      await window.electron.launchClient();
    }

    window.electron.onDownloadProgress((data) => {
      updateProgress(data);
    });

    window.electron.onStatusUpdate((data) => {
      updateStatus(
        data.message, 
        data.status,
        data.downloadPath,
        data.installPath
      );
    });

    window.electron.onAIMessage((message) => {
      updateAIMessage(message);
    });

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(checkAndDownload, 500);
    });
  </script>
</body>
</html>
