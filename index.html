<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AoX Net Installer</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const BootstrapperApp = () => {
      const [downloadStatus, setDownloadStatus] = useState('checking');
      const [progress, setProgress] = useState(0);
      const [downloadedMB, setDownloadedMB] = useState(0);
      const [totalMB, setTotalMB] = useState(0);
      const [currentSpeed, setCurrentSpeed] = useState(0);
      const [message, setMessage] = useState('Checking for Armies of Exigo Client...');
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        window.electron?.onDownloadProgress((data) => {
          setProgress(data.progress);
          setDownloadedMB(parseFloat(data.downloadedMB));
          setTotalMB(parseFloat(data.totalMB));
          const speed = (parseFloat(data.downloadedMB) / data.progress) * 10;
          setCurrentSpeed(speed);
        });

        window.electron?.onStatusUpdate((data) => {
          setDownloadStatus(data.status);
          setMessage(data.message);
        });

        checkAndDownload();
      }, []);

      const checkAndDownload = async () => {
        try {
          setMessage('Checking installation...');
          await sleep(500);

          const isInstalled = await window.electron?.checkInstalled();

          if (isInstalled) {
            setMessage('Checking for updates...');
            await sleep(1000);

            const serverVersion = await window.electron?.fetchServerVersion();
            const localVersion = await window.electron?.getLocalVersion();

            if (serverVersion === localVersion) {
              setMessage('Already up to date! Launching...');
              await sleep(1000);
              launchClient();
              return;
            } else {
              setMessage(`Update available: v${serverVersion}`);
              await sleep(1500);
            }
          }

          await downloadClient();
        } catch (error) {
          console.error('Bootstrap error:', error);
          setDownloadStatus('error');
          setErrorMsg(error.message || 'Failed to download AoX Client');
        }
      };

      const downloadClient = async () => {
        setDownloadStatus('downloading');
        setMessage('Downloading Armies of Exigo Matchmaking Client...');

        try {
          await window.electron?.downloadClient();

          setDownloadStatus('complete');
          setMessage('Installation complete!');
          setProgress(100);
          await sleep(1500);

          launchClient();
        } catch (error) {
          setDownloadStatus('error');
          setErrorMsg(error.message || 'Download failed');
        }
      };

      const launchClient = async () => {
        setMessage('Launching AoX Client...');
        await window.electron?.launchClient();
      };

      const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

      const retryDownload = () => {
        setDownloadStatus('checking');
        setProgress(0);
        setErrorMsg('');
        checkAndDownload();
      };

      return (
        <div className="min-h-screen bg-gradient-to-br from-indigo-950 via-purple-950 to-slate-950 flex items-center justify-center">
          <div className="w-full max-w-lg p-8">
            {/* Header */}
            <div className="text-center mb-8">
              <div className="flex items-center justify-center mb-4">
                <div className="relative">
                  <div className="w-20 h-20 bg-gradient-to-br from-purple-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-2xl shadow-purple-500/50">
                    <svg className="w-12 h-12 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                  </div>
                  <div className="absolute -bottom-1 -right-1 w-8 h-8 bg-green-500 rounded-full border-4 border-indigo-950 flex items-center justify-center">
                    <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd" />
                    </svg>
                  </div>
                </div>
              </div>
              <h1 className="text-4xl font-bold text-white mb-2 tracking-tight">
                AoX Net
              </h1>
              <p className="text-purple-300 text-lg font-medium">Armies of Exigo Matchmaking</p>
            </div>

            {/* Status Message */}
            <div className="bg-slate-800/50 backdrop-blur-sm border border-purple-500/20 rounded-xl p-6 shadow-2xl">
              <p className="text-center text-white font-medium mb-4">{message}</p>

              {downloadStatus === 'downloading' && (
                <div className="text-center text-sm text-gray-400 mb-3">
                  <span className="font-mono">{downloadedMB.toFixed(1)} MB</span> / <span className="font-mono">{totalMB.toFixed(1)} MB</span>
                </div>
              )}

              {downloadStatus !== 'error' && downloadStatus !== 'complete' && (
                <div className="mb-6">
                  <div className="relative h-4 bg-slate-700/50 rounded-full overflow-hidden border border-purple-500/20">
                    <div
                      className="absolute inset-y-0 left-0 bg-gradient-to-r from-purple-600 to-blue-600 transition-all duration-300 ease-out flex items-center justify-end pr-2"
                      style={{ width: `${progress}%` }}
                    >
                      {progress > 10 && (
                        <span className="text-xs font-bold text-white drop-shadow-lg">
                          {progress}%
                        </span>
                      )}
                    </div>
                  </div>
                </div>
              )}

              <div className="flex justify-center items-center gap-6 mb-8">
                <div className={`flex flex-col items-center ${downloadStatus === 'checking' ? 'opacity-100' : 'opacity-30'}`}>
                  <div className={`w-14 h-14 rounded-full border-4 border-purple-500/30 flex items-center justify-center ${downloadStatus === 'checking' ? 'animate-pulse' : ''}`}>
                    <svg className="w-7 h-7 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                  </div>
                  <p className="text-xs text-gray-400 mt-2">Checking</p>
                </div>

                <div className={`flex flex-col items-center ${downloadStatus === 'downloading' ? 'opacity-100' : 'opacity-30'}`}>
                  <div className={`w-14 h-14 rounded-full border-4 ${downloadStatus === 'downloading' ? 'border-blue-500 animate-spin' : 'border-purple-500/30'} flex items-center justify-center`}>
                    <svg className="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M9 19l3 3m0 0l3-3m-3 3V10" />
                    </svg>
                  </div>
                  <p className="text-xs text-gray-400 mt-2">Downloading</p>
                </div>

                <div className={`flex flex-col items-center ${downloadStatus === 'extracting' || downloadStatus === 'installing' ? 'opacity-100' : 'opacity-30'}`}>
                  <div className={`w-14 h-14 rounded-full border-4 ${downloadStatus === 'extracting' || downloadStatus === 'installing' ? 'border-green-500 animate-pulse' : 'border-purple-500/30'} flex items-center justify-center`}>
                    <svg className="w-7 h-7 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                  </div>
                  <p className="text-xs text-gray-400 mt-2">Installing</p>
                </div>

                <div className={`flex flex-col items-center ${downloadStatus === 'complete' ? 'opacity-100' : 'opacity-30'}`}>
                  <div className={`w-14 h-14 rounded-full border-4 ${downloadStatus === 'complete' ? 'border-green-500' : 'border-purple-500/30'} flex items-center justify-center`}>
                    <svg className="w-7 h-7 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" />
                    </svg>
                  </div>
                  <p className="text-xs text-gray-400 mt-2">Complete</p>
                </div>
              </div>

              {downloadStatus === 'error' && (
                <div className="bg-red-500/10 border border-red-500/30 rounded-lg p-4 mb-6">
                  <div className="flex items-start gap-3">
                    <svg className="w-6 h-6 text-red-400 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <div className="flex-1">
                      <h3 className="text-red-400 font-semibold mb-1">Download Failed</h3>
                      <p className="text-red-300 text-sm">{errorMsg}</p>
                    </div>
                  </div>
                  <button
                    onClick={retryDownload}
                    className="mt-4 w-full bg-red-600 hover:bg-red-700 text-white font-semibold py-3 px-6 rounded-lg transition-all shadow-lg hover:shadow-red-500/50"
                  >
                    Retry Download
                  </button>
                </div>
              )}

              {downloadStatus !== 'error' && (
                <div className="text-center text-sm text-gray-500 mt-6">
                  <p>Installing to: C:\AoX\AoX Client</p>
                  {downloadStatus === 'downloading' && <p className="mt-1">Please wait while we download the client...</p>}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<BootstrapperApp />);
  </script>
</body>
</html>
